# 从脱敏 config 提取的生效段落（写入值；运行时实际值见 04_runtime_evidence/run记录）
# --- quota ---
quota:
  video_seconds: 500
  images: 4000
  text_calls: 7200


# --- concurrency ---
concurrency:
  video_inflight: 1


# --- rpm ---
rpm:
    text: 20
    image_1k: 20
    image_2k: 16   # Token Plan 入门版 2K 可达约 80 RPM；按用户指引不过度并发，取 16（约 2.5 倍提速）。免费档实测值见 §4.1 勘误
    image_3k: 1
    image_4k: 1
    video: 1

  # 新档位制（AGNES_API_FACTS §2.3）：本项目一律用 1K 档
  image:
    size_tier: "1K"       # 16:9 -> 1312x736
    ratio: "16:9"
    timeout: 300

  video:
    frame_rate: 24
    polling_interval: 5   # 🔴 从 10 改为 5（官方建议）
    max_wait: 3600
