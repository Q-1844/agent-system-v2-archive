<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Phase54 看片对比 · 六部候选</title>
<style>
body{font-family:"Microsoft YaHei",sans-serif;background:#111;color:#eee;margin:0;padding:24px}
h1{font-size:20px;margin:0 0 4px} .sub{color:#999;font-size:13px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:20px}
.card{background:#1b1b1b;border:1px solid #333;border-radius:10px;padding:14px}
.card h2{font-size:16px;margin:0 0 2px} .meta{color:#aaa;font-size:12px;margin-bottom:8px}
video{width:100%;border-radius:6px;background:#000}
.fb{margin-top:10px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb select,.fb input{background:#222;color:#eee;border:1px solid #444;border-radius:4px;padding:4px}
.fb input{flex:1;min-width:140px}
.fb button{background:#2d6cdf;color:#fff;border:0;border-radius:4px;padding:5px 12px;cursor:pointer}
.tag{display:inline-block;background:#333;border-radius:4px;padding:2px 8px;font-size:12px;margin-left:6px}
.good{background:#1d4d2b}.warn{background:#5d4d1d}
</style>
</head>
<body>
<h1>Phase54 看片对比 · 六部候选</h1>
<div class="sub">P53 六员链基线 ×3 ＋ P54 新模式 ×3 ｜ 每部下方评分提交后落盘 FEEDBACK_P54.json（画面/衔接/总评）</div>
<div class="grid" id="grid"></div>
<script>
const FILMS=[
 {t:"P53-I《杯沿的断层》",tag:"六员链基线·室内对白片",m:"P53_I2",seq:"seq_c5315a4a",f:"srender_350ce21f.mp4",d:"71.25s",v:"PASS",note:"对白镜全通"},
 {t:"P53-F《灰塔的错误信号》",tag:"六员链基线·夜战要塞",m:"P53_F",seq:"seq_8b14e452",f:"srender_2f492acb.mp4",d:"36.76s",v:"PASS",note:"1 轮修复后过"},
 {t:"P53-M《第三道回声》",tag:"六员链基线·地下悬疑",m:"P53_M",seq:"seq_ec95c551",f:"srender_738a332c.mp4",d:"39.57s",v:"PASS",note:"怪物剪影 2 拦 2 修"},
 {t:"P54-B1《灰塔》模式②",tag:"单 Producer 全流程·同 F 故事",m:"P54_M2",seq:"seq_e6a15d56",f:"srender_7979eef4.mp4",d:"32.82s",v:"LIMITATIONS",note:"5.4h 含 token 断点+接力；s05 特写衔接弱"},
 {t:"P54-B2《回声》模式④ ★",tag:"主执行+上交·同 M 故事",m:"P54_M3",seq:"seq_4e14ce1d",f:"srender_b56b7b14.mp4",d:"39.55s",v:"LIMITATIONS",note:"1.74h（-63%）；零上交；对比 P53-M 同故事"},
 {t:"P54-B2-v1《回声》对比版",tag:"模式④自主加做",m:"P54_M3",seq:"seq_97b0905e",f:"srender_4625f15b.mp4",d:"51.57s",v:"未选",note:"超时长；白房空间断裂；门形态漂移"},
 {t:"P54-B3《回声》模式③★",tag:"预铺路+主执行·同 M 故事",m:"P54_M4",seq:"seq_75caf7ca",f:"srender_dfab1207.mp4",d:"42.37s",v:"FAIL(1镜)",note:"2.87h；s06 三人同框；s04 怪物剪影做对"},
 {t:"P54-M5《回声》组合配方",tag:"预铺+主执行+一票否决约束",m:"P54_M5",seq:"seq_0820bbb9",f:"srender_8d6e5f8c.mp4",d:"38.85s",v:"FAIL",note:"人数达标但场景乱跳(户外/金库门/集装箱)；根因=场景参考未强制进参考链"},
 {t:"P54-M6《回声》模式②",tag:"单Producer·M故事(带教训约束)",m:"P54_M6",seq:"seq_0b2e5e61",f:"srender_44b8a472.mp4",d:"42.37s",v:"LIMITATIONS",note:"门形态连续+人数纪律做对；库房偏亮"},
];
const grid=document.getElementById('grid');
FILMS.forEach((f,i)=>{
 const card=document.createElement('div');card.className='card';
 const vcls=f.v.startsWith('PASS')?'good':(f.v==='LIMITATIONS'?'warn':'');
 card.innerHTML=`<h2>${f.t}<span class="tag ${vcls}">${f.v}</span></h2>
 <div class="meta">${f.tag} ｜ ${f.d} ｜ ${f.note}</div>
 <video controls preload="metadata" src="/media/${f.m}/${f.seq}/${f.f}"></video>
 <div class="fb">
  画面 <select id="pic${i}"><option>好</option><option>可以</option><option>差</option></select>
  衔接 <select id="con${i}"><option>好</option><option>可以</option><option>差</option></select>
  总评 <select id="all${i}"><option>通过</option><option>通过但需修</option><option>不通过</option></select>
  <input id="note${i}" placeholder="备注（可空）">
  <button onclick="send(${i})">提交</button><span id="ok${i}" style="color:#7f7"></span>
 </div>`;
 grid.appendChild(card);
});
function send(i){
 const fb={film:FILMS[i].t,pic:document.getElementById('pic'+i).value,
  con:document.getElementById('con'+i).value,overall:document.getElementById('all'+i).value,
  note:document.getElementById('note'+i).value,ts:new Date().toISOString()};
 fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({fb})}).then(()=>document.getElementById('ok'+i).textContent='✓已记录');
}
</script>
</body>
</html>
